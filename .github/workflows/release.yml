name: Release

# Push a tag such as v1.0.0 to publish dist/*.zip as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          sh skills/tibbo-firmware/tests/run.sh
          sh skills/appblocks/tests/run.sh
      - name: Package
        run: sh tools/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Tibbo Skills $GITHUB_REF_NAME" \
            --notes "Install both packages. See the README for instructions and CHANGELOG.md for what changed."
