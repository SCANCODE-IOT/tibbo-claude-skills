name: Release

# Two ways to publish a release with dist/*.zip attached:
#  1. GitHub → Actions → Release → "Run workflow", enter a version such as v1.0.0.
#  2. Push a tag such as v1.0.0.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, e.g. v1.0.0"
        required: true
        default: "v1.0.0"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          sh skills/tibbo-firmware/tests/run.sh
          sh skills/appblocks/tests/run.sh
      - name: Package
        run: sh tools/package.sh
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          Install **both** packages — \`appblocks\` uses the TPS checker from \`tibbo-firmware\`.

          - **Claude apps:** Customize → Skills → + → Create skill → Upload a skill → upload \`tibbo-firmware.zip\`, then \`appblocks.zip\`.
          - **Claude Code:** \`/plugin marketplace add ${GITHUB_REPOSITORY}\`, then \`/plugin install tibbo-skills@scancode\`.

          See [README](https://github.com/${GITHUB_REPOSITORY}#readme) and [CHANGELOG](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md).
          EOF
          gh release create "$VERSION" dist/*.zip \
            --target "$GITHUB_SHA" \
            --title "Tibbo Skills $VERSION" \
            --notes-file notes.md
